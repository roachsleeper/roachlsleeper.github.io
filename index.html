<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#090d1d" />
    <title>傩 · 百鬼夜行</title>
    <link rel="stylesheet" href="web.css?v=asset-sync-v3" />
  </head>
  <body>
    <div class="orientation-gate" role="status" aria-live="polite">
      <div class="orientation-gate-icon" aria-hidden="true">↻</div>
      <strong>请将手机横向旋转</strong>
      <span>横屏后游戏会自动铺满屏幕</span>
    </div>
    <main class="site-shell">
      <div class="brand-mark" aria-hidden="true"><span>傩</span><i>百鬼夜行</i></div>
      <section class="game-frame" aria-label="傩百鬼夜行游戏">
        <canvas id="gameCanvas" width="960" height="540"></canvas>
      </section>
      <p class="site-hint"><span>电脑：点击画布左右两侧，或使用 A / D、方向键</span><span>手机：触摸画布左右两侧</span><span>底部技能按钮可直接点击</span></p>
    </main>
    <script type="module" src="web-entry.js?v=asset-sync-v3"></script>
